name: pokejob

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pokejob
    volumes:
      - db_data:/var/lib/mysql
      - ./initdb/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: pokejob
      DB_USER: root
      DB_PASSWORD: rootpassword
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    env_file:
      - ./.env
    command: sh -c "composer install --no-interaction --prefer-dist --no-progress && apache2-foreground"

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpassword

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  db_data:
